# Agent Lab OpenHands host-side Python dependency definition.
#
# This is a lab-owned, component-scoped SOURCE definition only (added in
# OH-001C). It declares exactly the direct, release-pinned host packages for
# the OpenHands candidate at the Agent Lab Python 3.13 target. It is NOT an
# installable package: [tool.uv] package = false makes it an explicitly
# non-package/virtual dependency-definition project for uv (it also has no
# [build-system] and is not published).
#
# No transitive dependency lock is hand-authored here. A guarded uv.lock is
# committed alongside this source definition; it is generated by the
# lab-managed uv (pinned in bootstrap/versions.env) and is authoritative for
# host materialization, which lives outside this definition repo. See
# docs/COMPONENT-OPENHANDS.md for the deterministic lab command.
#
# The Agent Server container digest is a separate, immutable runtime
# artifact pin recorded in manifests/components.toml. No container
# reference belongs in this file; this Python input must never contain a
# GHCR digest.
#
# Scope: openhands-sdk and openhands-tools only. openhands-workspace and
# openhands-agent-server are intentionally not host-installed (see
# docs/COMPONENT-OPENHANDS.md).

[project]
name = "agent-lab-openhands-deps"
version = "0.0.0"
description = "Agent Lab OpenHands host-side direct dependency definition (not published)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "openhands-sdk==1.42.1",
    "openhands-tools==1.42.1",
]

[tool.uv]
package = false
# Build-time constraint (OH-001D): pin the isolated PEP 517 build backend
# for sdist-only transitive inputs. func-timeout==4.3.5 is sdist-only and
# its fresh isolated build resolved setuptools>=40.8.0 to setuptools==84.0.0
# (OH-001D Stage 2 evidence). This makes that observed build backend
# deterministic without adding setuptools as a runtime dependency and
# without broadening the direct/installed dependency graph.
build-constraint-dependencies = ["setuptools==84.0.0"]
# Supply-chain freshness policy (OH-001C), matching the upstream
# OpenHands repository policy. Third-party transitive resolutions are
# deferred by a 7-day freshness cooldown (exclude-newer). The two direct
# host inputs are explicitly release-pinned and provenance-verified
# (see docs/COMPONENT-OPENHANDS.md), so they are exempt from the delay.
# The committed policy is the relative 7-day rule, which remains the policy
# for deliberate future relocks; the committed guarded lock persists the
# concrete resolved cutoff.
exclude-newer = "7 days"
exclude-newer-package = { "openhands-sdk" = false, "openhands-tools" = false }